<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#222">규칙에 없는 행동이 생기는 곳 : 다이내믹스</text>

  <rect x="40" y="70" width="240" height="170" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
  <rect x="330" y="70" width="240" height="170" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
  <rect x="620" y="70" width="240" height="170" rx="12" fill="#fde8ef" stroke="#d0436d" stroke-width="2"/>

  <text x="160" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#1f4fae">메커닉스</text>
  <text x="160" y="146" text-anchor="middle" font-size="15" fill="#222">무기</text>
  <text x="160" y="172" text-anchor="middle" font-size="15" fill="#222">탄약</text>
  <text x="160" y="198" text-anchor="middle" font-size="15" fill="#222">부활 지점</text>

  <text x="450" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#a86400">다이내믹스</text>
  <text x="450" y="146" text-anchor="middle" font-size="15" fill="#222">캠핑</text>
  <text x="450" y="168" text-anchor="middle" font-size="12" fill="#666">(한자리에 숨어 기다리기)</text>
  <text x="450" y="198" text-anchor="middle" font-size="15" fill="#222">저격</text>
  <text x="450" y="222" text-anchor="middle" font-size="12" fill="#a86400">어느 규칙에도 적혀 있지 않다</text>

  <text x="740" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#a0284f">에스테틱스</text>
  <text x="740" y="140" text-anchor="middle" font-size="15" fill="#222">도전</text>
  <text x="740" y="164" text-anchor="middle" font-size="15" fill="#222">감각</text>
  <text x="740" y="188" text-anchor="middle" font-size="15" fill="#222">경쟁</text>
  <text x="740" y="212" text-anchor="middle" font-size="15" fill="#222">판타지</text>

  <line x1="282" y1="155" x2="326" y2="155" stroke="#555" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="572" y1="155" x2="616" y2="155" stroke="#555" stroke-width="3" marker-end="url(#arr)"/>

  <text x="450" y="280" text-anchor="middle" font-size="13" fill="#666">메커닉스와 다이내믹스는 MDA 논문이 슈팅 게임 일반의 예로 든 것이고,</text>
  <text x="450" y="302" text-anchor="middle" font-size="13" fill="#666">에스테틱스는 논문이 Quake에 붙인 것이다. 셋을 한 줄로 이은 것은 정리한 사람의 해석이다</text>
</svg>
