<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#222">MDA 세 레이어 : 모노폴리로 보기</text>

  <!-- boxes -->
  <rect x="40" y="70" width="240" height="190" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
  <rect x="330" y="70" width="240" height="190" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
  <rect x="620" y="70" width="240" height="190" rx="12" fill="#fde8ef" stroke="#d0436d" stroke-width="2"/>

  <text x="160" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#1f4fae">메커닉스</text>
  <text x="160" y="128" text-anchor="middle" font-size="14" fill="#1f4fae">규칙과 부품</text>
  <text x="160" y="168" text-anchor="middle" font-size="15" fill="#222">주사위 두 개</text>
  <text x="160" y="194" text-anchor="middle" font-size="15" fill="#222">땅을 사면 임대료를 받는다</text>
  <text x="160" y="220" text-anchor="middle" font-size="15" fill="#222">독점하면 수익이 커진다</text>

  <text x="450" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#a86400">다이내믹스</text>
  <text x="450" y="128" text-anchor="middle" font-size="14" fill="#a86400">실제로 굴러가는 판의 흐름</text>
  <text x="450" y="168" text-anchor="middle" font-size="15" fill="#222">앞선 사람이 더 많이 번다</text>
  <text x="450" y="194" text-anchor="middle" font-size="15" fill="#222">뒤처진 사람은 더 잃는다</text>
  <text x="450" y="220" text-anchor="middle" font-size="15" fill="#222">격차가 점점 벌어진다</text>

  <text x="740" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#a0284f">에스테틱스</text>
  <text x="740" y="128" text-anchor="middle" font-size="14" fill="#a0284f">플레이어가 느끼는 감정</text>
  <text x="740" y="168" text-anchor="middle" font-size="15" fill="#222">격차가 벌어지면</text>
  <text x="740" y="194" text-anchor="middle" font-size="15" fill="#222">긴장이 사라지고</text>
  <text x="740" y="220" text-anchor="middle" font-size="15" fill="#222">몇 사람만 판에 몰입한다</text>

  <!-- arrows -->
  <line x1="282" y1="165" x2="326" y2="165" stroke="#555" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="572" y1="165" x2="616" y2="165" stroke="#555" stroke-width="3" marker-end="url(#arr)"/>
  <text x="305" y="140" text-anchor="middle" font-size="12" fill="#555">만든다</text>
  <text x="595" y="140" text-anchor="middle" font-size="12" fill="#555">만든다</text>

  <!-- control bracket -->
  <rect x="40" y="285" width="240" height="44" rx="8" fill="#3b6fd8"/>
  <text x="160" y="313" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">디자이너가 직접 정한다</text>
  <rect x="330" y="285" width="530" height="44" rx="8" fill="#f1f1f1" stroke="#bbb" stroke-dasharray="6 4"/>
  <text x="595" y="313" text-anchor="middle" font-size="15" fill="#444">직접 정할 수 없다. 메커닉스를 바꿔야 따라 바뀐다</text>

  <text x="450" y="372" text-anchor="middle" font-size="13" fill="#666">격차 문제와 원인은 MDA 논문의 모노폴리 분석을 따랐다. 칸 안의 구체적인 규칙 문장은 게임 규칙을 덧붙인 것이다</text>
</svg>
